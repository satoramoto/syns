<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Explorer — ~/Code (mockup)</title>
<style>
:root{--bg:#0f1115;--panel:#161922;--line:#262b38;--fg:#e6e8ee;--dim:#8b92a5;--acc:#7aa2ff;--ok:#5fd38d;--warn:#f0b35a;--bad:#ef6f6f}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fa;--panel:#fff;--line:#dfe3ec;--fg:#1b1f2a;--dim:#6b7285;--acc:#3b66e0;--ok:#1d9a56;--warn:#b5760f;--bad:#c93a3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex;height:100vh;overflow:hidden}
aside{width:210px;border-right:1px solid var(--line);padding:14px;overflow:auto;flex:none}
main{flex:1;display:flex;flex-direction:column;min-width:0}
h4{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);cursor:pointer;margin:0 4px 4px 0;font-size:12px;background:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fl{display:flex;justify-content:space-between;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--dim)}
.fl:hover{background:var(--panel)}.fl.on{background:var(--panel);color:var(--fg)}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
input{width:220px}
.tabs button{background:none;border:0;color:var(--dim);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--panel);color:var(--fg)}
.spacer{flex:1}.note{color:var(--dim);font-size:12px}
#view{flex:1;overflow:auto;padding:16px}
table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:-16px;background:var(--bg);cursor:pointer}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.r:hover{background:var(--panel);cursor:pointer}
.nm{font-weight:600}.org{color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--dim);margin-right:3px}
.lang{font-size:11px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.col h3{margin:18px 0 8px;font-size:13px;display:flex;gap:8px;align-items:baseline}.col h3 span{color:var(--dim);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}.card:hover{border-color:var(--acc)}
.card .t{display:flex;justify-content:space-between;gap:6px}.card .m{color:var(--dim);font-size:12px;margin-top:4px}
.wtbar{display:flex;gap:2px;margin-top:6px}.wtbar i{width:9px;height:9px;border-radius:2px;background:var(--acc);opacity:.7}
svg text{fill:var(--fg);font-size:11px;pointer-events:none}
.node rect{fill:var(--panel);stroke:var(--line)}.node{cursor:pointer}.node:hover rect,.node.sel rect{stroke:var(--acc)}
.edge{stroke:var(--dim);fill:none;opacity:.35}.edge.hi{stroke:var(--acc);opacity:1}
#detail{width:320px;border-left:1px solid var(--line);padding:16px;overflow:auto;flex:none;display:none}
#detail.open{display:block}
#detail h2{margin:0 0 2px;font-size:16px}#detail dl{display:grid;grid-template-columns:90px 1fr;gap:6px 8px;margin:14px 0}dt{color:var(--dim)}dd{margin:0}
.wt{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;font-family:ui-monospace,monospace;font-size:12px}
.x{float:right;cursor:pointer;color:var(--dim)}
.banner{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px;color:var(--dim);font-size:12px}
a{color:var(--acc)}
</style></head><body>
<aside>
  <div style="font-weight:700;font-size:15px">~/Code</div>
  <div class="note" id="count"></div>
  <h4>Org</h4><div id="f-org"></div>
  <h4>Tags</h4><div id="f-tag"></div>
  <h4>Status</h4><div id="f-status"></div>
  <h4>Language</h4><div id="f-lang"></div>
</aside>
<main>
  <header>
    <input id="q" placeholder="Filter repos…  (name, tag, branch)">
    <div class="tabs" id="tabs"></div>
    <span class="spacer"></span>
    <label class="note" id="gl">Group by <select id="group"></select></label>
  </header>
  <div id="view"></div>
</main>
<div id="detail"></div>
<script src="repos.js"></script>
<script>
// Data comes from repos.js, generated by `node scan.mjs` (canonical copy: ~/.syns/repos.json; tags live in ~/.syns/repo-tags.json).
const TODAY=new Date(window.REPOS?.scanned||Date.now());
const R=(window.REPOS?.repos||[]).map(r=>{
  const days=Math.round((TODAY-new Date(r.last))/864e5);
  const status=r.dirty>0?'dirty':days>60?'stale':days<=3?'active':'clean';
  return {...r,days,status,last:r.last.slice(0,10),wts:r.worktrees.map(w=>w.branch)};
});
const SC={dirty:'var(--warn)',active:'var(--ok)',clean:'var(--dim)',stale:'var(--bad)'};
const byId=Object.fromEntries(R.map(r=>[r.id,r]));

const S={view:'table',group:'org',q:'',f:{org:null,tag:null,status:null,lang:null},sel:null,sort:'last',dir:-1};
const $=s=>document.querySelector(s);
const views={table:'Table',board:'Board',graph:'Dependencies',wt:'Worktrees'};
$('#tabs').innerHTML=Object.entries(views).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
$('#group').innerHTML=['org','tag','status','lang'].map(g=>`<option>${g}</option>`).join('');
$('#tabs').onclick=e=>{if(e.target.dataset.v){S.view=e.target.dataset.v;render()}};
$('#group').onchange=e=>{S.group=e.target.value;render()};
$('#q').oninput=e=>{S.q=e.target.value.toLowerCase();render()};

const filtered=()=>R.filter(r=>(!S.f.org||r.org===S.f.org)&&(!S.f.tag||r.tags.includes(S.f.tag))&&(!S.f.status||r.status===S.f.status)&&(!S.f.lang||r.lang===S.f.lang)
  &&(!S.q||(r.id+' '+r.tags.join(' ')+' '+r.branch).toLowerCase().includes(S.q)));

function side(){
  const tally=(fn)=>{const m={};R.forEach(r=>[].concat(fn(r)).forEach(k=>m[k]=(m[k]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const list=(key,items)=>`${items.map(([k,n])=>`<div class="fl ${S.f[key]===k?'on':''}" data-k="${key}" data-val="${k}"><span>${key==='status'?`<i class="dot" style="background:${SC[k]}"></i>`:''}${k}</span><span>${n}</span></div>`).join('')}`;
  $('#f-org').innerHTML=list('org',tally(r=>r.org));
  $('#f-status').innerHTML=list('status',tally(r=>r.status));
  $('#f-lang').innerHTML=list('lang',tally(r=>r.lang));
  $('#f-tag').innerHTML=tally(r=>r.tags).map(([k,n])=>`<span class="chip ${S.f.tag===k?'on':''}" data-k="tag" data-val="${k}">${k} ${n}</span>`).join('');
  $('#count').textContent=`${filtered().length} of ${R.length} repos · ${R.reduce((a,r)=>a+r.wts.length,0)} worktrees`;
}
document.querySelector('aside').onclick=e=>{const t=e.target.closest('[data-k]');if(!t)return;const {k,val}=t.dataset;S.f[k]=S.f[k]===val?null:val;render()};

const row=(r)=>`<tr class="r" data-id="${r.id}"><td><i class="dot" style="background:${SC[r.status]}"></i><span class="nm">${r.name}</span> <span class="org">${r.org}</span></td>
<td>${r.branch}${r.dirty?` <span style="color:var(--warn)">±${r.dirty}</span>`:''}</td><td>${r.wts.length?r.wts.length+' wt':'—'}</td>
<td>${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</td><td class="lang">${r.lang}</td><td class="note">${r.days}d ago</td></tr>`;

function table(){
  const rs=filtered().sort((a,b)=>{const k=S.sort;const av=k==='last'?-a.days:a[k],bv=k==='last'?-b.days:b[k];return (av>bv?1:av<bv?-1:0)*S.dir});
  return `<table><thead><tr>${[['name','Repo'],['branch','Branch'],['wts','Worktrees'],['tags','Tags'],['lang','Lang'],['last','Last commit']].map(([k,l])=>`<th data-s="${k}">${l}</th>`).join('')}</tr></thead><tbody>${rs.map(row).join('')}</tbody></table>`;
}
function board(){
  const g={};filtered().forEach(r=>{const ks=S.group==='tag'?r.tags:[r[S.group]];ks.forEach(k=>(g[k]=g[k]||[]).push(r))});
  return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,rs])=>`<div class="col"><h3>${k}<span>${rs.length}</span></h3><div class="grid">${rs.map(r=>`
  <div class="card" data-id="${r.id}"><div class="t"><span class="nm"><i class="dot" style="background:${SC[r.status]}"></i>${r.name}</span><span class="lang">${r.lang}</span></div>
  <div class="m">${r.purpose||r.branch}</div><div style="margin-top:6px">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  ${r.wts.length?`<div class="wtbar" title="${r.wts.length} worktrees">${r.wts.map(()=>'<i></i>').join('')}</div>`:''}</div>`).join('')}</div></div>`).join('');
}
function graph(){
  const rs=filtered(),ids=new Set(rs.map(r=>r.id));
  const edges=[];rs.forEach(r=>r.deps.forEach(d=>{if(byId[d]&&ids.has(d))edges.push([r.id,d])}));
  const linked=new Set(edges.flat());const nodes=rs.filter(r=>linked.has(r.id));
  const loose=rs.filter(r=>!linked.has(r.id));
  // layer = longest path down to a leaf dependency
  const depth={};const dp=id=>depth[id]??(depth[id]=1+Math.max(-1,...byId[id].deps.filter(d=>byId[d]&&ids.has(d)).map(dp)));
  nodes.forEach(n=>dp(n.id));
  const L=[];nodes.forEach(n=>(L[depth[n.id]]=L[depth[n.id]]||[]).push(n));
  const W=170,H=34,gx=40,gy=70,pos={};
  L.forEach((col,i)=>col.forEach((n,j)=>pos[n.id]={x:20+i*(W+gx+30),y:20+j*(H+gy/2)}));
  const sel=S.sel;
  const paths=edges.map(([a,b])=>{const A=pos[a],B=pos[b];const x1=A.x,y1=A.y+H/2,x2=B.x+W,y2=B.y+H/2,mx=(x1+x2)/2;
    return `<path class="edge ${sel&&(a===sel||b===sel)?'hi':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#ar)"/>`}).join('');
  const ns=nodes.map(n=>`<g class="node ${sel===n.id?'sel':''}" data-id="${n.id}" transform="translate(${pos[n.id].x},${pos[n.id].y})"><rect width="${W}" height="${H}" rx="6"/><circle cx="12" cy="${H/2}" r="4" fill="${SC[n.status]}"/><text x="24" y="14">${n.name}</text><text x="24" y="27" style="fill:var(--dim)">${n.org}</text></g>`).join('');
  const w=20+L.length*(W+gx+30),h=40+Math.max(...L.map(c=>c.length))*(H+gy/2);
  return `<div class="banner">Arrows point from a repo to what it depends on (right = depended on). Edges come from package.json plus hand-added ones in the sidecar. ${loose.length} repos have no known dependencies and are hidden here: <span style="color:var(--fg)">${loose.map(l=>l.name).join(', ')}</span></div>
  <svg width="${w}" height="${h}"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" fill="var(--dim)"/></marker></defs>${paths}${ns}</svg>`;
}
function wt(){
  const rs=filtered().filter(r=>r.wts.length).sort((a,b)=>b.wts.length-a.wts.length);
  return `<div class="banner">Every repo with extra worktrees. In the real version each row would show the branch, dirty state, open PR and linked Claude session, with "prune merged" as a one-click action.</div>`+
  rs.map(r=>`<div class="col"><h3 data-id="${r.id}" style="cursor:pointer">${r.name}<span>${r.org} · ${r.wts.length} worktrees</span></h3>
  <div class="grid"><div class="wt">● ${r.branch} <span class="note">(main checkout)</span></div>${r.wts.map(w=>`<div class="wt">○ ${w}</div>`).join('')}</div></div>`).join('');
}
function detail(){
  const el=$('#detail'),r=byId[S.sel];if(!r){el.className='';return}
  const dependents=R.filter(x=>x.deps.includes(r.id));
  const lk=id=>`<a href="#" data-id="${id}">${id.split('/')[1]}</a>`;
  el.className='open';
  el.innerHTML=`<span class="x" id="close">✕</span><h2>${r.name}</h2><div class="note">~/Code/${r.id}</div>
  <p>${r.purpose||'<span class="note">No description yet.</span>'}</p>
  <dl><dt>Status</dt><dd><i class="dot" style="background:${SC[r.status]}"></i>${r.status}${r.dirty?` · ${r.dirty} changed files`:''}</dd>
  <dt>Branch</dt><dd>${r.branch}</dd><dt>Last commit</dt><dd>${r.last} (${r.days}d)</dd><dt>Language</dt><dd>${r.lang}</dd>
  <dt>Tags</dt><dd>${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag">+ add</span></dd>
  <dt>Depends on</dt><dd>${r.deps.length?r.deps.map(lk).join(', '):'—'}</dd>
  <dt>Used by</dt><dd>${dependents.length?dependents.map(d=>lk(d.id)).join(', '):'—'}</dd></dl>
  ${r.wts.length?`<h4>Worktrees</h4>${r.wts.map(w=>`<div class="wt">${w}</div>`).join('')}`:''}
  <h4>Actions (mock)</h4><span class="chip">Open in editor</span><span class="chip">New Claude session here</span><span class="chip">Sessions (3)</span><span class="chip">Open PRs</span>`;
  $('#close').onclick=()=>{S.sel=null;render()};
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#gl').style.display=S.view==='board'?'':'none';
  side();
  $('#view').innerHTML={table,board,graph,wt}[S.view]();
  detail();
}
$('#view').onclick=e=>{
  const th=e.target.closest('th');if(th){const k=th.dataset.s;S.dir=S.sort===k?-S.dir:1;S.sort=k;return render()}
  const t=e.target.closest('[data-id]');if(t){S.sel=t.dataset.id;render()}};
$('#detail').onclick=e=>{const a=e.target.closest('a[data-id]');if(a){e.preventDefault();S.sel=a.dataset.id;render()}};
render();
</script></body></html>
